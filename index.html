<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>地震時 行動ナビ</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-title-row">
      <h1>地震時 行動ナビ</h1>
      <a id="githubUpdateLink" class="update-link" href="https://life-support-lab.github.io/bousai-app/" role="button">最新版に更新</a>
    </div>
  </header>

  <main>
    <section class="card important-card">
      <h2>1. 地震はどのくらい前に発生しましたか</h2>
      <p class="guide-text">非常時は、まず近いものを選んでください。あとで正確な日時に修正できます。</p>
      <div class="quick-buttons" aria-label="発生時刻の簡単入力">
        <button type="button" class="small-button" data-minutes-ago="0">今発生</button>
        <button type="button" class="small-button" data-minutes-ago="5">5分前</button>
        <button type="button" class="small-button" data-minutes-ago="10">10分前</button>
        <button type="button" class="small-button" data-minutes-ago="30">30分前</button>
        <button type="button" class="small-button" data-minutes-ago="60">1時間前</button>
        <button type="button" class="small-button" data-minutes-ago="120">2時間前</button>
        <button type="button" class="small-button" data-minutes-ago="180">3時間前</button>
        <button type="button" class="small-button" data-minutes-ago="360">6時間前</button>
        <button type="button" class="small-button" data-minutes-ago="720">12時間前</button>
        <button type="button" class="small-button" data-minutes-ago="4320">3日前</button>
        <button type="button" class="small-button" data-minutes-ago="10080">7日前</button>
      </div>

      <div class="datetime-panel">
        <div class="datetime-panel-head">
          <span class="field-label-small">発生日時</span>
          <span id="selectedAgoText" class="selected-ago-text tentative">暫定日時</span>
        </div>
        <p id="elapsedText" class="elapsed-text">発生時刻を選択してください。</p>
        <label for="quakeTimeInput" class="datetime-edit-label">余裕ができたら正確な日時に修正</label>
        <div class="datetime-split" aria-label="地震が発生した日時">
          <div class="datetime-part">
            <span class="field-label-small">日付</span>
            <input id="quakeDateInput" type="date" />
          </div>
          <div class="datetime-part">
            <span class="field-label-small">時刻</span>
            <input id="quakeClockInput" type="time" />
          </div>
        </div>
        <input id="quakeTimeInput" type="hidden" />
      </div>
    </section>

    <section class="card">
      <h2>2. 立場を選ぶ</h2>
      <label for="roleSelect">自分の立場</label>
      <select id="roleSelect"></select>
    </section>

    <section class="card action-card">
      <div class="section-title-row">
        <div>
          <h2>3. やること一覧</h2>
          <p id="summaryText" class="guide-text">発生時刻と立場を選ぶと表示されます。</p>
        </div>
        <span id="taskCount" class="badge">0件</span>
      </div>
      <div id="taskList" class="task-list"></div>
    </section>

    <section class="card">
      <div class="section-title-row">
        <div>
          <h2>4. 時系列の見える化</h2>
          <p id="timelineGuide" class="guide-text">選んだ経過時間に応じて横軸を圧縮して表示します。</p>
        </div>
      </div>
      <div class="timeline-wrapper" id="timelineWrapper">
        <div class="timeline-scale" id="timelineScale"></div>
        <div class="timeline-now" id="timelineNow"><span>現在</span></div>
        <div id="timelineList" class="timeline-list"></div>
      </div>
    </section>

    <section class="card reset-card">
      <button id="resetChecksButton" class="reset-button" type="button">チェックをリセット</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
